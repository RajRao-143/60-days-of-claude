<!DOCTYPE html>
<html lang="en" data-theme="orange">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Detective — ABTalks Day 34</title>
<style>
:root{
  --accent:#e8743b;--accent-2:#f6a36b;--accent-ink:#1a0e06;
  --bg:#1c1a18;--bg-2:#292623;--panel:#2f2b28;--line:#4a443f;
  --cork:#7b5c3f;--cork-dark:#5f4530;
  --paper:#f6ecd9;--paper-2:#efe1c6;--ink:#2b2620;--ink-soft:#5a4f43;
  --text:#f3ece2;--muted:#b9ada0;--ok:#7fd69b;--bad:#ff8a7a;
}
:root[data-theme="blue"]{--accent:#5b92ff;--accent-2:#9bbcff;--accent-ink:#06122b;--bg:#0c1428;--bg-2:#14213d;--panel:#1a2a4a;--line:#2d4570;--cork:#4b5876;--cork-dark:#384460;--muted:#a9b6cf}
:root[data-theme="emerald"]{--accent:#2fc790;--accent-2:#79e3bb;--accent-ink:#04180f;--bg:#0b1a15;--bg-2:#12281f;--panel:#173428;--line:#2a5744;--cork:#46604f;--cork-dark:#344a3d;--muted:#a5bdb2}
:root[data-theme="purple"]{--accent:#a97bff;--accent-2:#cbb0ff;--accent-ink:#150a2b;--bg:#150d26;--bg-2:#20143a;--panel:#2a1b4b;--line:#463174;--cork:#5a4577;--cork-dark:#443359;--muted:#bbaed3}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(1200px 700px at 80% -10%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 60%),linear-gradient(160deg,var(--bg),var(--bg-2) 70%,var(--bg));background-attachment:fixed;overflow-wrap:anywhere}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .5em;font-family:Georgia,"Times New Roman",serif;letter-spacing:.01em}
p{margin:0 0 .8em}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--accent-ink);padding:8px 12px;z-index:100}
.skip:focus{left:8px;top:8px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 48px}
.ico{flex:none;vertical-align:-4px}
.muted{color:var(--muted)}
/* header */
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center;color:var(--accent-2)}
.brand b{display:block;font-family:Georgia,serif;font-size:1.2rem;color:var(--text)}
.brand span{font-size:.78rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:color-mix(in srgb,var(--panel) 90%,black);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.78rem;color:var(--muted)}
.chip b{color:var(--text)}
.themesel{display:flex;gap:6px;align-items:center;font-size:.82rem;color:var(--muted)}
.themesel select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
/* stepper */
.stepper{display:flex;gap:6px;list-style:none;margin:14px 0;padding:0;overflow-x:auto}
.stepper li{flex:1 0 auto}
.stepper button{width:100%;display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer;font-size:.8rem;color:var(--muted);text-align:left;white-space:nowrap}
.stepper button[disabled]{opacity:.45;cursor:not-allowed}
.stepper .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;font-size:.75rem;font-weight:700}
.stepper .done .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper [aria-current="step"]{border-color:var(--accent);color:var(--text);box-shadow:0 0 0 1px var(--accent) inset,0 0 18px color-mix(in srgb,var(--accent) 30%,transparent)}
/* stage */
.stage{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stage-title{font-size:clamp(1.5rem,4vw,2.2rem);margin:6px 0 4px;outline:none}
.kicker{color:var(--accent-2);text-transform:uppercase;letter-spacing:.14em;font-size:.76rem;font-weight:700}
.lead{color:var(--muted);max-width:70ch}
/* buttons */
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 55%,black);transition:transform .12s,filter .12s}
.btn:hover:not([disabled]){filter:brightness(1.08);transform:translateY(-1px)}
.btn:active:not([disabled]){transform:translateY(2px);box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not([disabled]){border-color:var(--accent)}
.btn.ok{background:color-mix(in srgb,var(--ok) 25%,transparent);color:var(--text);border:1.5px solid var(--ok);box-shadow:none}
.btn.big{padding:13px 26px;font-size:1.05rem}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
/* paper */
.paper{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 30%),repeating-linear-gradient(0deg,rgba(120,90,50,.045) 0 1px,transparent 1px 26px),var(--paper);color:var(--ink);border-radius:6px;padding:20px;box-shadow:0 10px 24px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.4) inset}
.paper h2,.paper h3,.paper h4{color:#2b1c10}
.paper .muted{color:var(--ink-soft)}
.folder-tab{position:absolute;top:-14px;left:18px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;padding:3px 12px;border-radius:6px 6px 0 0}
.stamp-conf{position:absolute;right:14px;top:12px;border:3px solid #b3402c;color:#b3402c;font-weight:900;letter-spacing:.2em;font-size:.8rem;padding:2px 10px;transform:rotate(7deg);opacity:.75}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.kv{background:var(--paper-2);border-radius:6px;padding:10px 12px;border-left:4px solid var(--accent)}
.kv small{display:block;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);font-size:.7rem}
.kv b{font-size:1.05rem}
.mystery{font-family:Georgia,serif;font-style:italic;font-size:1.2rem;border-left:4px solid var(--accent);padding:4px 0 4px 14px;margin:16px 0}
.sticky{background:#ffe9a8;color:#3b2f10;padding:12px 14px;border-radius:2px;box-shadow:3px 5px 10px rgba(0,0,0,.3);font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive,sans-serif;font-size:.92rem;transform:rotate(-1.2deg);position:relative}
.sticky:nth-child(even){background:#ffd2b0;transform:rotate(1.4deg)}
.sticky:nth-child(3n){background:#fff4dc;transform:rotate(-.5deg)}
.sticky::before{content:"";position:absolute;top:-6px;left:50%;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 2px 3px rgba(0,0,0,.4);transform:translateX(-50%)}
.sticky cite{display:block;font-family:system-ui,sans-serif;font-style:normal;font-size:.74rem;opacity:.75;margin-top:6px}
/* theme picker */
.themes{border:0;padding:0;margin:18px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.themes legend{font-weight:700;margin-bottom:8px}
.tcard{position:relative;display:block;cursor:pointer;border:2px solid var(--line);border-radius:12px;padding:14px;background:var(--panel);transition:border-color .15s,transform .15s}
.tcard:hover{transform:translateY(-2px)}
.tcard input{position:absolute;opacity:0;inset:0;cursor:pointer}
.tcard.selected{border-color:var(--accent);box-shadow:0 0 22px color-mix(in srgb,var(--accent) 35%,transparent)}
.tcard:focus-within{outline:3px solid var(--accent-2);outline-offset:2px}
.sw{display:flex;gap:5px;margin:8px 0}
.sw i{width:30px;height:30px;border-radius:7px;border:1px solid rgba(255,255,255,.25)}
.rec{display:inline-block;background:var(--accent);color:var(--accent-ink);font-size:.68rem;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:.08em}
.sel-mark{font-weight:700;font-size:.82rem;color:var(--accent-2)}
/* progress */
.prog{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid var(--line)}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s}
.prog-lbl{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin:4px 0 6px}
/* board stage 2 */
.cork{background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.07) 0 2px,transparent 3px) 0 0/22px 22px,radial-gradient(circle at 70% 60%,rgba(0,0,0,.12) 0 2px,transparent 3px) 0 0/17px 17px,linear-gradient(135deg,var(--cork),var(--cork-dark));border-radius:14px;padding:18px;border:6px solid #3c2b1d;box-shadow:inset 0 0 40px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.4)}
.layout2{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:18px;align-items:start}
.check{list-style:none;margin:0;padding:0}
.check li{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:.9rem;border-bottom:1px dashed rgba(0,0,0,.18)}
.check .box{width:18px;height:18px;border:2px solid var(--ink-soft);border-radius:4px;display:inline-grid;place-items:center;font-size:.75rem;font-weight:900}
.check .on .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.folder{background:var(--paper);color:var(--ink);border-radius:4px 10px 6px 6px;margin-bottom:14px;box-shadow:0 6px 14px rgba(0,0,0,.35);position:relative}
.folder>button{width:100%;display:flex;gap:10px;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#f9d9a5,#f2c887);border:0;border-radius:4px 10px 0 0;padding:12px 14px;cursor:pointer;color:#3a2410;font-weight:800;font-family:Georgia,serif;font-size:1.02rem;text-align:left}
.folder.seen>button{box-shadow:inset 0 -3px 0 var(--accent)}
.folder>button .st{font:700 .72rem system-ui;letter-spacing:.1em;text-transform:uppercase;color:#7a3f17}
.folder .body{padding:16px}
.folder .locked{color:var(--ink-soft);font-style:italic}
.folder h4{margin:14px 0 6px;font-size:.95rem}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.metric{background:var(--paper-2);border-radius:6px;padding:9px 11px;border-bottom:3px solid var(--accent)}
.metric small{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.metric b{font-size:1.25rem}
.metric span{display:block;font-size:.74rem;color:var(--ink-soft)}
.bar-row{display:grid;grid-template-columns:minmax(80px,1.1fr) 3fr minmax(70px,.9fr);gap:8px;align-items:center;margin:6px 0;font-size:.86rem}
.bar{position:relative;height:16px;border-radius:5px;background:rgba(60,40,20,.14);overflow:visible}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transform-origin:left;animation:grow .9s ease both}
.bar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:#2b1c10}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar-val{text-align:right;font-weight:700}
.stack{display:flex;height:26px;border-radius:6px;overflow:hidden;border:1px solid rgba(0,0,0,.25)}
.stack i{display:block;animation:grow .9s ease both;transform-origin:left}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0;font-size:.82rem}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;background:var(--c);vertical-align:-1px;border:1px solid rgba(0,0,0,.3)}
.funnel{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.fstep{flex:1 1 130px;background:var(--paper-2);border-radius:6px;padding:10px;text-align:center;border-top:4px solid var(--accent)}
.fstep b{display:block;font-size:1.1rem}
.farrow{align-self:center;font-weight:800;color:var(--accent);font-size:.8rem;text-align:center}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid rgba(0,0,0,.15)}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
td.num,th.num{text-align:right}
.note{font-size:.78rem;color:var(--ink-soft);font-style:italic}
.cmts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding-top:8px}
.tableWrap{overflow-x:auto}
/* stage 3 */
.s3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:18px;align-items:start}
.tray{border:2px dashed var(--line);border-radius:12px;padding:12px;background:rgba(0,0,0,.18);min-height:120px}
.tray.over,.slot.over{outline:3px dashed var(--accent-2)}
.tray h3,.board-wrap h3{font-size:1rem;margin-bottom:8px}
.evlist{display:grid;gap:10px}
.ev{display:block;background:var(--paper);color:var(--ink);border-radius:5px;padding:10px 12px;cursor:grab;border:2px solid transparent;box-shadow:0 4px 10px rgba(0,0,0,.3);transition:transform .15s,border-color .15s}
.ev:hover{transform:translateY(-2px) rotate(-.4deg)}
.ev.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent),0 6px 14px rgba(0,0,0,.4)}
.ev.rev{background:linear-gradient(180deg,#eef3dd,var(--paper))}
.ev-top{display:flex;justify-content:space-between;gap:6px;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);font-weight:800}
.badge{color:#1e6b3a}
.ev-ttl{display:block;font-weight:800;font-family:Georgia,serif;margin:3px 0}
.ev-sum{display:block;font-size:.82rem;color:var(--ink-soft)}
.insp{margin-top:14px}
.insp.empty{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:10px;padding:14px;color:var(--muted)}
.detail{background:var(--paper-2);border-left:4px solid var(--accent);padding:10px 12px;margin:10px 0;border-radius:4px;animation:fadeUp .3s both}
.detail ul{margin:6px 0 0;padding-left:18px}
.src{font-size:.78rem;color:var(--ink-soft);font-style:italic}
.board-wrap{position:relative}
.board-grid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.strings{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:visible}
.strings path{fill:none;stroke:#c8362b;stroke-width:2.2;stroke-linecap:round;opacity:.9;filter:drop-shadow(0 2px 1px rgba(0,0,0,.4))}
.slot{position:relative;z-index:1;min-height:126px;border-radius:6px;padding:14px 6px 6px}
.slot:not(.filled){border:2px dashed rgba(255,255,255,.35);background:rgba(0,0,0,.13)}
.slot-btn{width:100%;height:100%;min-height:96px;background:transparent;border:0;cursor:pointer;color:#f4e8d6;font-size:.82rem;display:grid;place-items:center;text-align:center;border-radius:4px}
.slot-btn:hover{background:rgba(255,255,255,.08)}
.slot .num{font-weight:900;font-size:1.3rem;display:block;opacity:.75}
.pushpin{position:absolute;top:2px;left:50%;width:16px;height:16px;border-radius:50%;transform:translateX(-50%);z-index:3;box-shadow:inset -3px -3px 4px rgba(0,0,0,.35),0 3px 4px rgba(0,0,0,.45);background:var(--accent)}
.pushpin.p1{background:#d94b43}.pushpin.p2{background:#3f8fd9}.pushpin.p3{background:#58b36a}
.mini{position:absolute;right:8px;bottom:8px;font-size:.72rem;background:rgba(0,0,0,.65);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:2px 8px;cursor:pointer;z-index:4}
.slot.filled .ev{padding-bottom:30px}
.pinfo{display:flex;flex-wrap:wrap;gap:14px;margin:10px 0 14px}
.pinfo>div{flex:1 1 200px}
/* stage 4 */
.opts{display:grid;gap:10px;margin:14px 0;border:0;padding:0}
.opt{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.opt:hover:not(.ruled){border-color:var(--accent)}
.opt.chosen{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.opt.ruled{opacity:.6;cursor:not-allowed;text-decoration:line-through}
.opt input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px}
.opt b{display:block}
.opt small{color:var(--muted)}
.opt .tag{font-size:.72rem;font-weight:800;color:var(--bad);text-decoration:none;display:inline-block}
.fb{border-radius:10px;padding:14px 16px;margin:12px 0;border:2px solid var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}
.fb.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--panel))}
.fb b.lbl{display:block;margin-bottom:4px}
/* stage 5 */
.closed-hero{text-align:center;padding:26px 10px 8px}
.stamp{display:inline-block;font:900 clamp(2rem,9vw,4.2rem)/1 Georgia,serif;color:#d1402e;border:7px double #d1402e;padding:8px 26px;border-radius:8px;letter-spacing:.08em;transform:rotate(-7deg);background:rgba(255,255,255,.04);text-shadow:0 0 1px #000;animation:stamp .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{0%{opacity:0;transform:rotate(-18deg) scale(2.6)}60%{opacity:1;transform:rotate(-7deg) scale(.94)}100%{opacity:1;transform:rotate(-7deg) scale(1)}}
.cluecard{background:var(--paper);color:var(--ink);padding:14px;border-radius:6px;border-top:5px solid var(--accent);box-shadow:0 6px 14px rgba(0,0,0,.3)}
.cluecard h4{color:#2b1c10;margin-bottom:4px}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.cmp>div{border-radius:8px;padding:14px}
.cmp .bef{background:color-mix(in srgb,var(--bad) 14%,var(--panel));border:2px solid color-mix(in srgb,var(--bad) 55%,transparent)}
.cmp .aft{background:color-mix(in srgb,var(--ok) 14%,var(--panel));border:2px solid color-mix(in srgb,var(--ok) 55%,transparent)}
.cmp h3,.cmp h4{margin-bottom:6px}
.cmp ul{margin:0;padding-left:20px}
.sec{margin:22px 0}
.sec>h3{color:var(--accent-2);border-bottom:1px solid var(--line);padding-bottom:4px}
.numlist{counter-reset:n;list-style:none;padding:0;margin:0}
.numlist li{counter-increment:n;padding-left:34px;position:relative;margin:7px 0}
.numlist li::before{content:counter(n);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;display:grid;place-items:center;font-size:.8rem}
.ba-row{margin:12px 0}
.ba-row .bar{background:rgba(255,255,255,.1)}
.ba-row .bar-row{color:var(--text)}
.ba-row .bar-val{color:var(--text)}
.tagline{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--muted)}
.score{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.score div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:120px}
.score b{display:block;font-size:1.3rem;color:var(--accent-2)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:860px){
  .layout2,.s3{grid-template-columns:minmax(0,1fr)}
  .bar-row{grid-template-columns:minmax(70px,1fr) 2fr minmax(60px,.9fr)}
}
@media (max-width:540px){
  .board-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .cork{padding:10px;border-width:4px}
  .paper{padding:14px}
  .stamp-conf{position:static;display:inline-block;transform:none;margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="wrap" id="app"></div>
<div id="live" class="sr" aria-live="polite" role="status"></div>
<div id="toast" aria-hidden="true"></div>
<script>
(function(){
'use strict';

/* ================= DATA ================= */

/* ================= EVIDENCE ================= */
function makeEvidence(c){
  const m=c.metrics,ctr=ctrOf(c),cvr=cvrOf(c);
  const list=c.alloc.map(a=>`<li>${a.ch}: ${money(a.amt)} (${pct(a.amt/c.budget*100)})</li>`).join('');
  const per=c.alloc.map(a=>`<li>${a.ch}: ${money(a.amt)} spent · ${fmt(a.conv)} ${m.convLabel.toLowerCase()} · ${money(Math.round(a.amt/a.conv))} each</li>`).join('');
  const engaged=Math.round(m.reach*m.eng/100);
  const big=c.alloc.slice().sort((a,b)=>b.amt-a.amt)[0];
  const ctx=[
   {id:'metrics',title:"Clicks vs. results",icon:'chart',src:"Campaign dashboard",summary:`CTR ${pct(ctr)} · ${pct(cvr)} of clicks became ${m.convLabel.toLowerCase()}`,
    detail:`<p>${fmt(m.impr)} impressions reached ${fmt(m.reach)} people. ${fmt(m.clicks)} clicks gave a CTR of ${pct(ctr)}. Those clicks produced ${fmt(m.conv)} ${m.convLabel.toLowerCase()}, a click-to-conversion rate of ${pct(cvr)}.</p><p class="note">Illustrative teaching benchmarks (not industry standards): CTR ${BENCH.ctr}%, click-to-conversion ${BENCH.conv}%.</p>`},
   {id:'budget',title:"Budget ledger",icon:'coin',src:"Finance sheet",summary:`${money(c.budget)} total · largest line: ${big.ch} (${pct(big.amt/c.budget*100)})`,
    detail:`<p>The ${money(c.budget)} budget was split across ${c.alloc.length} lines:</p><ul>${list}</ul>`},
   {id:'comments-a',title:"Customer comments (1)",icon:'chat',src:"Collected feedback",summary:c.comments[0].split(' — ')[1]||"Customer feedback",
    detail:`<p>${c.comments[0]}</p><p>${c.comments[1]}</p>`},
   {id:'channels',title:"Channel results",icon:'funnel',src:"Channel report",summary:`${c.alloc.length} channels · cost per ${m.convLabel.toLowerCase().replace(/s$/,'')} ranges ${money(Math.round(Math.min(...c.alloc.map(a=>a.amt/a.conv))))}–${money(Math.round(Math.max(...c.alloc.map(a=>a.amt/a.conv))))}`,
    detail:`<ul>${per}</ul>`},
   {id:'social',title:"Social media snapshot",icon:'share',src:"Social analytics",summary:`${c.social[0].p}: ${c.social[0].s}`,
    detail:`<ul>${c.social.map(s=>`<li><b>${s.p}</b>: ${s.s}</li>`).join('')}</ul><p class="note">Overall engagement rate: ${pct(m.eng)} of reach (about ${fmt(engaged)} engagements).</p>`},
   {id:'comments-b',title:"Customer comments (2)",icon:'mail',src:"Collected feedback",summary:c.comments[2].split(' — ')[1]||"Customer feedback",
    detail:`<p>${c.comments[2]}</p><p>${c.comments[3]}</p>`}
  ];
  const ic=['search','funnel','target'];
  const clues=c.clues.map((k,i)=>({id:'clue'+i,kind:'clue',title:k.t,icon:ic[i],src:k.src,summary:k.src,detail:`<p>${k.txt}</p>`}));
  const order=[ctx[0],clues[0],ctx[1],ctx[2],clues[1],ctx[3],ctx[4],clues[2],ctx[5]];
  order.forEach((e,i)=>{e.letter=LETTERS[i];if(!e.kind)e.kind='ctx'});
  return order;
}

/* ================= CASE LIFECYCLE ================= */
function newCase(){
  let idx;
  do{idx=Math.floor(Math.random()*CASES.length)}while(CASES.length>1&&idx===state.lastCase);
  state.lastCase=idx;
  const c=CASES[idx];
  const others=shuffle(Object.keys(MISTAKES).filter(k=>k!==c.mistake)).slice(0,3);
  const ev=makeEvidence(c);
  state.cs={ci:idx,c,ev,seen:{},open:{},examined:{},reviewed:{},slots:ev.map(()=>null),selected:null,
    attempts:0,wrong:[],options:shuffle([c.mistake].concat(others)),choice:null,feedback:null,confirmReveal:false,
    accepted:false,solved:false,revealed:false,maxStage:1,pts:{review:0,clues:0,verdict:0}};
  state.stage=1;stageChanged=true;
}
function go(n){
  const cs=state.cs;if(!cs||n<1||n>cs.maxStage)return;
  state.stage=n;stageChanged=true;render();
}
function unlock(n){const cs=state.cs;if(n>cs.maxStage)cs.maxStage=n}
const seenCount=()=>Object.keys(state.cs.seen).length;
const reviewedCount=()=>Object.keys(state.cs.reviewed).length;
const pinnedCount=()=>state.cs.slots.filter(Boolean).length;
const evById=id=>state.cs.ev.find(e=>e.id===id);

function pin(id,slot){
  const cs=state.cs,e=evById(id);if(!e)return;
  const cur=cs.slots.indexOf(id);
  if(slot==null){slot=cs.slots.indexOf(null);if(slot<0){say('The board is full. Unpin something first.');return}}
  if(cur===slot){cs.selected=id;return render()}
  const occ=cs.slots[slot];
  if(occ&&cur<0){say('That slot is taken. Choose another slot or unpin an exhibit first.');return}
  if(cur>=0)cs.slots[cur]=occ||null;
  cs.slots[slot]=id;cs.selected=id;
  say(`Exhibit ${e.letter} ${cur>=0?'moved to':'pinned in'} slot ${slot+1}.`);
  render();
}
function unpin(id){
  const cs=state.cs,i=cs.slots.indexOf(id);if(i<0)return;
  cs.slots[i]=null;say(`Exhibit ${evById(id).letter} removed from the board.`);render();
}
function submitVerdict(){
  const cs=state.cs;if(!cs.choice)return;
  cs.attempts++;
  if(cs.choice===cs.c.mistake){
    const clueN=cs.slots.filter(id=>id&&id.indexOf('clue')===0).length;
    cs.pts.clues=clueN*10;
    cs.pts.verdict=cs.attempts===1?40:cs.attempts===2?25:10;
    state.stats.score+=cs.pts.clues+cs.pts.verdict;
    state.stats.solved++;
    if(cs.attempts===1)state.stats.firstTry++;
    cs.solved=true;cs.feedback=null;unlock(5);
    say('Verdict confirmed. Case solved, well done, detective.');
    go(5);
  }else{
    const mk=MISTAKES[cs.choice];
    const hint=cs.wrong.length===0?cs.c.hint:`Re-read the exhibit titled “${cs.c.clues[0].t}” and ask what it implies for the whole campaign.`;
    cs.wrong.push(cs.choice);
    cs.feedback={label:mk.label,why:`“${mk.label}” touches part of the ${cs.c.company} story but doesn't fully fit the evidence. Check whether ${mk.test}. If the answer is yes, this explanation isn't enough to account for the gap between what the campaign did and what ${cs.c.company} wanted.`,hint};
    cs.choice=null;
    say('Not quite. See the feedback and try again.');
    render();
  }
}
function revealCase(){
  const cs=state.cs;cs.revealed=true;cs.confirmReveal=false;unlock(5);
  say('Case file opened. No verdict points awarded for this case.');go(5);
}

  if(k==='brief')return `<div class="grid2"><div class="kv"><small>Company</small><b>${c.company}</b></div><div class="kv"><small>Industry</small><b>${c.industry}</b></div></div>
   <h4>Objective</h4><p>${c.objective}</p><h4>Audience</h4><p>${c.audience}</p><h4>Background</h4><p>${c.brief}</p>`;
  if(k==='budget'){
    const cols=['var(--accent)','#6fb3d9','#a6d17a','#e5c27a'];
    return `<p>Total budget: <b>${money(c.budget)}</b></p><div class="stack" role="img" aria-label="Budget split: ${c.alloc.map(a=>a.ch+' '+pct(a.amt/c.budget*100)).join(', ')}">${c.alloc.map((a,i)=>`<i style="width:${a.amt/c.budget*100}%;background:${cols[i%4]}"></i>`).join('')}</div>

    ${c.alloc.map(a=>bar(a.ch,a.amt,Math.max(...c.alloc.map(x=>x.amt)),money(a.amt))).join('')}`;

  if(k==='metrics'){

function keyOf(el){return el&&el.dataset&&el.dataset.act?{a:el.dataset.act,i:el.dataset.id||'',k:el.dataset.k||'',n:el.dataset.n||''}:null}
function refocus(f){
  if(!f)return;
  const els=app.querySelectorAll('[data-act]');
  for(const el of els){if(el.dataset.act===f.a&&(el.dataset.id||'')===f.i&&(el.dataset.k||'')===f.k&&(el.dataset.n||'')===f.n){el.focus({preventScroll:true});return}}

}
function drawStrings(){
  const grid=app.querySelector('.board-grid'),svg=app.querySelector('.strings');if(!grid||!svg)return;
  const gr=grid.getBoundingClientRect();
  svg.setAttribute('width',gr.width);svg.setAttribute('height',gr.height);svg.setAttribute('viewBox','0 0 '+gr.width+' '+gr.height);
  const pts=[];grid.querySelectorAll('.slot.filled').forEach(s=>{const r=s.getBoundingClientRect();pts.push([r.left-gr.left+r.width/2,r.top-gr.top+10])});
  if(pts.length<2){svg.innerHTML='';return}
  let d='M'+pts[0][0]+','+pts[0][1];
  for(let i=1;i<pts.length;i++){const q=pts[i-1],p=pts[i];d+=' Q'+(p[0]+q[0])/2+','+((p[1]+q[1])/2+22)+' '+p[0]+','+p[1]}
  svg.innerHTML='<path d="'+d+'"/>';
}

  else refocus(f);
  if(st===3)drawStrings();
}

/* ================= EVENTS (attached once) ================= */
function act(a,d){
  const cs=state.cs;
  switch(a){
   case 'start':newCase();render();break;
   case 'accept':if(!cs.accepted){cs.accepted=true;state.stats.investigated++}unlock(2);go(2);break;
   case 'nav':go(+d.n);break;
   case 'folder':{const k=d.k;cs.open[k]=!cs.open[k];if(cs.open[k]&&!cs.seen[k]){cs.seen[k]=true;say(FOLDERS.find(f=>f.k===k).n+' opened.')}render();break}
   case 'to3':unlock(3);go(3);break;
   case 'to4':unlock(4);go(4);break;
   case 'select':cs.selected=d.id;render();break;
   case 'examine':cs.examined[d.id]=true;render();break;
   case 'review':if(cs.examined[d.id]&&!cs.reviewed[d.id]){cs.reviewed[d.id]=true;cs.pts.review+=5;state.stats.reviewed++;state.stats.score+=5;say('Exhibit '+evById(d.id).letter+' marked as reviewed.')}render();break;
   case 'pin':pin(d.id);break;
   case 'unpin':unpin(d.id);break;
   case 'slot':if(!cs.selected){say('Select an exhibit first, then choose a slot.');break}pin(cs.selected,+d.n);break;
   case 'submit':submitVerdict();break;
   case 'reveal':cs.confirmReveal=true;render();break;
   case 'reveal-no':cs.confirmReveal=false;render();break;
   case 'reveal-yes':revealCase();break;
   case 'to6':unlock(6);go(6);break;
   case 'next':newCase();say('New case assigned. Your theme and session stats carry over.');render();break;
  }
}
app.addEventListener('click',e=>{

  if(t.name==='theme'){applyTheme(t.value);app.querySelectorAll('.tcard').forEach(l=>l.classList.toggle('selected',l.contains(t)));const s=document.getElementById('themeSelect');if(s)s.value=t.value;say(THEMES[t.value].n+' theme applied.');return}
  if(t.name==='verdict'){
    state.cs.choice=t.value;
    app.querySelectorAll('.opt').forEach(l=>l.classList.toggle('chosen',l.contains(t)));
    const sb=document.getElementById('submitBtn');if(sb)sb.disabled=false;
  }
});
/* drag and drop */
app.addEventListener('dragstart',e=>{
  const el=e.target.closest&&e.target.closest('.ev[data-id]');if(!el||!e.dataTransfer)return;
  e.dataTransfer.setData('text/plain',el.dataset.id);e.dataTransfer.effectAllowed='move';
});
app.addEventListener('dragover',e=>{
  const z=e.target.closest&&e.target.closest('.slot,.tray');if(!z)return;
  e.preventDefault();app.querySelectorAll('.over').forEach(x=>x!==z&&x.classList.remove('over'));z.classList.add('over');
});
app.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('.slot,.tray');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over')});
app.addEventListener('drop',e=>{
  const z=e.target.closest&&e.target.closest('.slot,.tray');if(!z)return;
  e.preventDefault();z.classList.remove('over');
  const id=e.dataTransfer&&e.dataTransfer.getData('text/plain');if(!id||!state.cs||!evById(id))return;
  if(z.classList.contains('tray'))unpin(id);else pin(id,+z.dataset.slot);
});
app.addEventListener('dragend',()=>app.querySelectorAll('.over').forEach(x=>x.classList.remove('over')));
window.addEventListener('resize',()=>{if(state.stage===3)drawStrings()});

render();
})();
</script>
</body>
</html>
