const describeCost=v=>v>0?"raises operating cost by "+fmt(v)+" FC":v<0?"lowers operating cost by "+fmt(Math.abs(v))+" FC":"keeps operating cost unchanged";
function buildReport(company,d,ev){
const mk=(list,n,dir)=>{const out=[],seen=new Set();list.forEach(x=>{if(out.length<n&&!seen.has(x.metric)){seen.add(x.metric);out.push(x)}});list.forEach(x=>{if(out.length<n&&!out.includes(x))out.push(x)});const items=out.map(c=>({metric:c.metric,text:c.opt+" "+(dir>0?"raises ":"lowers ")+MLABEL[c.metric]+" by "+Math.abs(c.delta)+" points ("+MMEAN[c.metric]+")."+(c.note?" Here, "+c.note.charAt(0).toLowerCase()+c.note.slice(1):"")}));const sortedM=[...METRICS].sort((a,b)=>dir>0?ev.metrics[b.key]-ev.metrics[a.key]:ev.metrics[a.key]-ev.metrics[b.key]);sortedM.forEach(m=>{if(items.length<n&&!items.some(i=>i.metric===m.key))items.push({metric:m.key,text:MLABEL[m.key]+" finishes at "+ev.metrics[m.key]+"/100, "+(dir>0?"one of your better areas":"one of your lower areas")+" ("+MMEAN[m.key]+")."})});return items.slice(0,n)};
const strengths=mk(ev.contribs.filter(c=>c.delta>0).sort((a,b)=>b.delta-a.delta),3,1),weaknesses=mk(ev.contribs.filter(c=>c.delta<0).sort((a,b)=>a.delta-b.delta),3,-1),focus=company.challenge.focus;
const riskKey=[...METRICS].sort((a,b)=>(ev.metrics[a.key]-(a.key===focus?8:0))-(ev.metrics[b.key]-(b.key===focus?8:0)))[0].key;
const culprit=ev.contribs.filter(c=>c.metric===riskKey&&c.delta<0).sort((a,b)=>a.delta-b.delta)[0];
const conseq={cost:"operating costs could balloon and wipe out your margins if conditions worsen.",speed:"late deliveries could push customers toward faster competitors.",rel:"a single disruption could stop supply and leave orders unfilled.",sat:"customers may face stockouts or slow service and stop buying.",sus:"you may fail emission targets and lose retail partners."};
const risk=MLABEL[riskKey]+" is the most likely point of failure, ending at "+ev.metrics[riskKey]+"/100"+(culprit?", mainly because of your "+culprit.stageTitle.toLowerCase()+" choice ("+culprit.opt+", "+sign(culprit.delta)+")":"")+". Since "+company.name+" already faces \""+company.challenge.title.toLowerCase()+"\", "+conseq[riskKey];
const cands=STAGES.map(st=>{let best=null;st.options.forEach(o=>{if(o.id===d[st.key])return;const e2=evaluate(company,{...d,[st.key]:o.id}),gain=e2.overallRaw-ev.overallRaw;if(!best||gain>best.gain)best={st,o,e2,gain}});return best}).filter(Boolean);
const better=cands.filter(c=>c.e2.overall>ev.overall).sort((a,b)=>(b.e2.overall-a.e2.overall)||(b.gain-a.gain)),keeps=cands.filter(c=>c.e2.overall<=ev.overall).sort((a,b)=>a.gain-b.gain);
const recs=[...better,...keeps].slice(0,3).map(s=>{const cur=s.st.options.find(o=>o.id===d[s.st.key]),dOp=s.e2.op-ev.op;
if(s.e2.overall>ev.overall){const diffs=METRICS.map(m=>({k:m.key,v:s.e2.metrics[m.key]-ev.metrics[m.key]})),up=[...diffs].sort((a,b)=>b.v-a.v)[0],down=[...diffs].sort((a,b)=>a.v-b.v)[0],linked=weaknesses.map((w,i)=>({w,i,v:diffs.find(x=>x.k===w.metric).v})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v)[0];let body="Projected overall score: "+ev.overall+" → "+s.e2.overall+" ("+sign(s.e2.overall-ev.overall)+"). This switch "+describeDelta(MLABEL[up.k],up.v);if(down.v<0&&down.k!==up.k)body+=", but "+describeDelta(MLABEL[down.k],down.v);body+="; it also "+describeCost(dOp)+".";return{title:"Switch "+s.st.title+" from "+cur.label+" to "+s.o.label,body,link:linked?"Addresses Weakness "+(linked.i+1)+" ("+MLABEL[linked.w.metric]+").":"Strengthens "+MLABEL[up.k]+", which supports your goal of handling \""+company.challenge.title.toLowerCase()+"\"."}}
const topContrib=ev.contribs.filter(c=>c.stage===s.st.key&&c.delta>0).sort((a,b)=>b.delta-a.delta)[0],sIdx=topContrib?strengths.findIndex(x=>x.metric===topContrib.metric):-1;
return{title:"Keep "+s.st.title+" as "+cur.label,body:"Your best alternative here, "+s.o.label+", would not raise your overall score ("+ev.overall+" → "+s.e2.overall+") and would "+describeCost(dOp).replace(/^(raises|lowers|keeps)/,w=>w==="raises"?"raise":w==="lowers"?"lower":"keep")+". Protect this choice while you fix other areas.",link:topContrib?(sIdx>=0?"Protects Strength "+(sIdx+1)+" ("+MLABEL[topContrib.metric]+").":"Protects "+MLABEL[topContrib.metric]+", where this choice adds "+topContrib.delta+" points."):"Protects the balance of your current supply chain design."}});
return{strengths,weaknesses,risk,recs};
}
function Bar({value,base}){const[w,setW]=useState(0);useEffect(()=>{const t=setTimeout(()=>setW(value),40);return()=>clearTimeout(t)},[value]);return <div className="bar" role="progressbar" aria-valuenow={value} aria-valuemin="0" aria-valuemax="100"><div className="fill" style={{width:w+"%"}}/>{base!=null&&<div className="basemark" style={{left:base+"%"}} title="Baseline 50"/>}</div>}
function MetricsPanel({ev,company}){const baseOp=Math.round(BASE_OP*DEMAND_MULT[company.demand]);return <aside className="card side" aria-label="Live metrics"><h3>Live Metrics</h3><p className="small muted">Baseline is 50 (purple marker). All values are simulation estimates.</p>{METRICS.map(m=>{const diff=ev.metrics[m.key]-50;return <div className="metric" key={m.key}><div className="mrow"><span>{m.label}</span><span><b>{ev.metrics[m.key]}</b>/100 <span className={cls(diff)}>({sign(diff)} vs baseline)</span></span></div><Bar value={ev.metrics[m.key]} base={50}/></div>})}<div className="opcost"><div className="small muted">Estimated monthly operating cost (fictional credits, FC)</div><div className="big">{fmt(ev.op)} FC</div><div className="small"><span className={cls(-(ev.op-baseOp))}>{sign(ev.op-baseOp)} FC</span> <span className="muted">vs baseline {fmt(baseOp)} FC (lower is better)</span></div></div></aside>}
function Stepper({step}){const labels=["Welcome","Company","Supplier","Factory","Warehouse","Transport","Inventory","Dashboard"];return <nav aria-label="Progress"><div className="stepper">{labels.map((l,i)=><div key={l} className={"pill "+(i<step?"done":i===step?"active":"")} aria-current={i===step?"step":undefined}>{i<step?"✓ ":(i+1)+". "}<span className="lbl">{l}</span></div>)}</div><div className="stepline">Step {step+1} of 8 · Current stage: <b>{labels[step]}</b></div></nav>}
function CompanyCard({company}){return <div className="kv"><div><b>Company</b>{company.name}</div><div><b>Industry</b>{company.industry}</div><div><b>Main product</b>{company.product}</div><div><b>Regions served</b>{company.regions.join(", ")}</div><div><b>Demand level</b>{company.demand}</div><div><b>Challenge</b>{company.challenge.title}</div></div>}
function Welcome({onStart}){return <div className="screen card hero"><div className="logo" style={{margin:"0 auto 12px",width:54,height:54,fontSize:"1.6rem"}}>SC</div><h1>Supply Chain Builder</h1><p className="muted">ABTalks 60 Days Claude Challenge · Day 30</p><div style={{maxWidth:680,margin:"18px auto",textAlign:"left"}}><p><b>What is a supply chain?</b> A supply chain is the complete journey of a product, from raw materials and suppliers to manufacturing, storage, transportation, and delivery to the customer.</p><p><b>Your goal:</b> design a supply chain for a fictional company that balances <b>cost</b>, <b>speed</b>, <b>reliability</b>, <b>customer satisfaction</b> and <b>sustainability</b>. You will make five decisions. Before each one you will learn what it means, why it matters, and what trade-offs it creates. There is no perfect answer: the best choice depends on the company.</p></div><button className="btn primary" onClick={onStart}>Start Building</button><div className="note" style={{maxWidth:560,margin:"18px auto 0"}}>Note: this app loads React and Babel from online CDNs. The first load needs an internet connection unless those scripts are already cached by your browser.</div></div>}
function CompanyScreen({company,onNext,onBack}){return <div className="screen"><div className="card"><h2>🏢 Your Company Briefing</h2><CompanyCard company={company}/><h3 style={{marginTop:16}}>The business challenge: {company.challenge.title}</h3><p>{company.challenge.text}</p><p className="muted"><b>Why it matters:</b> {company.challenge.why}</p><p className="muted"><b>Demand:</b> {company.demand==="High"?"High demand means large volumes. Stockouts and bottlenecks hurt more, but bulk buying helps.":company.demand==="Medium"?"Medium demand means steady volumes where balanced strategies tend to work well.":"Low demand means small volumes. Expensive networks and big stocks may be under-used."} Both demand and this challenge will change how each of your decisions scores.</p></div><div className="actions"><button className="btn ghost" onClick={onBack}>← Back</button><button className="btn primary" onClick={onNext}>Continue to Supplier Strategy →</button></div></div>}
function DecisionScreen({stage,index,company,d,ev,onSelect,onNext,onBack}){const selId=d[stage.key],sel=stage.options.find(o=>o.id===selId);let fb=null;if(sel){const mine=ev.contribs.filter(c=>c.stage===stage.key),agg={};mine.forEach(c=>agg[c.metric]=(agg[c.metric]||0)+c.delta);const notes=mine.filter(c=>c.note),opd=ev.opByStage[stage.key]||0;fb=<div className="card fb" aria-live="polite"><h3>How "{sel.label}" affects {company.name}</h3><p>For {company.name}, a {company.industry.toLowerCase()} company selling {company.product} with {company.demand.toLowerCase()} demand, this choice {sel.impact}.</p><div className="chips">{METRICS.filter(m=>agg[m.key]).map(m=><span className="chip" key={m.key}>{m.label}: <b className={cls(agg[m.key])}>{sign(agg[m.key])}</b></span>)}<span className="chip">Operating cost: <b className={cls(-opd)}>{sign(opd)} FC</b></span></div>{notes.length>0&&<div><p className="small muted" style={{marginBottom:0}}>Because of your situation:</p><ul>{notes.map((n,i)=><li key={i}>{n.note} <b className={cls(n.delta)}>({MLABEL[n.metric]} {sign(n.delta)})</b></li>)}</ul></div>}<p className="small muted">The live metrics panel has been updated. Changing this choice later recalculates everything from scratch. Metric changes shown here are this decision's contribution before the 0–100 limit is applied.</p></div>}const isLast=index===STAGES.length-1;return <div className="screen"><h2>{stage.icon} Decision {index+1} of 5: {stage.title}</h2><div className="card"><h3><span className="num">1</span>What does it mean?</h3><p>{stage.mean}</p></div><div className="card"><h3><span className="num">2</span>Why does it matter?</h3><p>{stage.why}</p></div><div className="card"><h3><span className="num">3</span>Business trade-offs</h3><div className="grid2"><div className="up"><b>What can improve</b><p className="small">{stage.up}</p></div><div className="down"><b>What may get worse</b><p className="small">{stage.down}</p></div></div></div><div className="card"><h3><span className="num">4</span>Your decision</h3><p className="small muted">Choose exactly one option. Company reminder: {company.name}, {company.demand} demand, challenge: {company.challenge.title}.</p><div className="options" role="radiogroup" aria-label={stage.title+" options"}>{stage.options.map(o=><button key={o.id} type="button" role="radio" aria-checked={selId===o.id} className={"opt "+(selId===o.id?"sel":"")} onClick={()=>onSelect(stage.key,o.id)}>{selId===o.id&&<span className="chk">✓ SELECTED</span>}<div className="ico">{o.icon}</div><h4>{o.label}</h4><div className="small muted">{o.desc}</div><ul className="pro">{o.pros.map(p=><li key={p}>{p}</li>)}</ul><ul className="con">{o.cons.map(p=><li key={p}>{p}</li>)}</ul></button>)}</div></div>{fb}<div className="actions"><button className="btn ghost" onClick={onBack}>← Back</button>{!sel&&<span className="hint">Select one option to continue</span>}<button className="btn primary" disabled={!sel} onClick={onNext}>{isLast?"See Final Dashboard →":"Continue →"}</button></div></div>}
function Dashboard({company,d,ev,onBack,onReplay}){const rep=buildReport(company,d,ev),tier=ev.overall>=75?"Strong":ev.overall>=60?"Solid":ev.overall>=45?"Needs work":"At risk",best=[...METRICS].sort((a,b)=>ev.metrics[b.key]-ev.metrics[a.key])[0],worst=[...METRICS].sort((a,b)=>ev.metrics[a.key]-ev.metrics[b.key])[0],baseOp=Math.round(BASE_OP*DEMAND_MULT[company.demand]),choiceNames=STAGES.map(s=>s.options.find(o=>o.id===d[s.key]).label);return <div className="screen"><h2>📈 Final Optimization Dashboard</h2><div className="card dash-top"><div className="score" style={{background:"conic-gradient(var(--cyan) "+ev.overall*3.6+"deg,#0a1330 0deg)"}}><div><div><div className="n">{ev.overall}</div><div className="small muted">/ 100 · {tier}</div></div></div></div><div><h3>Overall Supply Chain Score</h3><p className="small">Formula: <b>Score = 25% Cost Efficiency + 20% Delivery Speed + 25% Reliability + 20% Customer Satisfaction + 10% Sustainability</b></p><p className="small muted">In simple words: cost and reliability matter most (25% each), speed and customer satisfaction count a bit less (20% each), and sustainability counts 10%. Each metric is multiplied by its weight and the results are added up.</p><p className="small muted">All scores and costs are simulation estimates, not real financial forecasts.</p></div></div><div className="card"><h3>Final metrics</h3>{METRICS.map(m=><div className="metric" key={m.key}><div className="mrow"><span>{m.label} <span className="muted small">(weight {Math.round(m.weight*100)}%)</span></span><span><b>{ev.metrics[m.key]}</b>/100 <span className={cls(ev.metrics[m.key]-50)}>({sign(ev.metrics[m.key]-50)} vs baseline)</span></span></div><Bar value={ev.metrics[m.key]} base={50}/></div>)}<div className="opcost"><span className="muted small">Estimated monthly operating cost: </span><b className="big">{fmt(ev.op)} FC</b><span className="small muted"> ({sign(ev.op-baseOp)} FC vs baseline {fmt(baseOp)} FC)</span></div></div><div className="card"><h3>Company profile</h3><CompanyCard company={company}/><p className="small muted" style={{marginTop:10}}>{company.challenge.text}</p></div><div className="card"><h3>Your five decisions</h3><table><tbody>{STAGES.map((s,i)=><tr key={s.key}><th scope="row">{s.icon} {s.title}</th><td>{choiceNames[i]}</td></tr>)}</tbody></table></div><div className="grid2"><div className="card"><h3>✅ Three strengths</h3><ul className="list s">{rep.strengths.map((s,i)=><li key={i}><b>S{i+1}.</b> {s.text}</li>)}</ul></div><div className="card"><h3>⚠️ Three weaknesses / trade-offs</h3><ul className="list w">{rep.weaknesses.map((s,i)=><li key={i}><b>W{i+1}.</b> {s.text}</li>)}</ul></div></div><div className="card risk"><h3>🚨 Biggest risk</h3><p>{rep.risk}</p></div><div className="card"><h3>🛠️ Three prioritized recommendations</h3><p className="small muted">Ranked by projected overall score gain from recalculating your actual choices. If no change would help a stage, the advice is to keep it.</p><ul className="list r">{rep.recs.map((r,i)=><li key={i}><span className="badge">Priority {i+1}</span><b>{r.title}</b><p className="small" style={{marginBottom:2}}>{r.body}</p><p className="small muted" style={{margin:0}}>🔗 {r.link}</p></li>)}</ul></div><div className="card"><h3>🎓 What you learned</h3><p>You built a supply chain for {company.name} using {choiceNames.join(", ")}. Your strongest area was {best.label} ({ev.metrics[best.key]}/100) and your weakest was {worst.label} ({ev.metrics[worst.key]}/100).</p><p>The key lesson: every supply chain decision is a trade-off. Saving money often costs speed or resilience, and speed often costs money and sustainability. The right answer depended on {company.name}'s {company.demand.toLowerCase()} demand and its challenge of "{company.challenge.title.toLowerCase()}". A different company would need a different design.</p><p className="muted small">Try the recommendations by going back and changing a decision, or replay with a new company to see how the same choices score differently.</p></div><div className="actions"><button className="btn ghost" onClick={onBack}>← Back to Inventory</button><button className="btn primary" onClick={onReplay}>↻ Replay with New Company</button></div></div>}
function App(){const[step,setStep]=useState(0),[company,setCompany]=useState(()=>newCompany()),[d,setD]=useState({}),ev=evaluate(company,d),firstMissing=STAGES.findIndex(s=>!d[s.key]);let safeStep=step;if(step>=2&&step<=6&&firstMissing!==-1&&step-2>firstMissing)safeStep=firstMissing+2;if(step===7&&firstMissing!==-1)safeStep=firstMissing+2;const go=n=>{setStep(n);window.scrollTo({top:0,behavior:"smooth"})},start=()=>{setCompany(prev=>newCompany(prev));setD({});go(1)},replay=()=>{setCompany(prev=>newCompany(prev));setD({});go(1)},select=(key,id)=>{const stage=STAGES.find(s=>s.key===key);if(!stage||!stage.options.some(o=>o.id===id))return;setD(prev=>({...prev,[key]:id}))};let body;if(safeStep===0)body=<Welcome onStart={start}/>;else if(safeStep===1)body=<CompanyScreen company={company} onNext={()=>go(2)} onBack={()=>go(0)}/>;else if(safeStep>=2&&safeStep<=6){const idx=safeStep-2;body=<DecisionScreen key={STAGES[idx].key} stage={STAGES[idx]} index={idx} company={company} d={d} ev={ev} onSelect={select} onNext={()=>d[STAGES[idx].key]&&go(safeStep+1)} onBack={()=>go(safeStep-1)}/>}else body=<Dashboard company={company} d={d} ev={ev} onBack={()=>go(6)} onReplay={replay}/>;return <div className="app"><header className="topbar"><div className="brand"><div className="logo">SC</div>Supply Chain Builder</div><span className="tag">ABTalks Day 30 · Simulation estimates only</span></header><Stepper step={safeStep}/>{safeStep>=1&&safeStep<=6?<main className="layout"><div key={safeStep}>{body}</div><MetricsPanel ev={ev} company={company}/></main>:<main key={safeStep}>{body}</main>}</div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
